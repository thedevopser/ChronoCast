name: chronocast

services:
  dev:
    build:
      context: ..
      dockerfile: docker/Dockerfile.dev
    working_dir: /app
    volumes:
      - ..:/app
      - node_modules:/app/node_modules
    environment:
      CHRONOCAST_DATA_DIR: /tmp/chronocast-data
    init: true
    command: ["sleep", "infinity"]

volumes:
  node_modules:
