name: Release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Installer les dépendances
        run: npm ci --ignore-scripts

      - name: Vérifier la cohérence du tag et de package.json
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          tag="${GITHUB_REF_NAME#v}"
          manifest="$(node -p "require('./package.json').version")"
          if [ "$tag" != "$manifest" ]; then
            echo "::error::le tag ($tag) et package.json ($manifest) désignent des versions différentes"
            exit 1
          fi
          echo "version : $manifest"

      - name: Vérifier l’identité du paquet
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          if grep -qE '^[[:space:]]*(identityName|publisher|publisherDisplayName):.*IDENTITE-PARTNER-CENTER' electron-builder.yml; then
            echo "::error::l'identité du paquet n'est pas renseignée dans electron-builder.yml"
            echo "::error::relevez identityName, publisher et publisherDisplayName dans Partner Center → Identité du produit"
            exit 1
          fi
          echo "identité du paquet renseignée"

      - name: Vérifier
        run: npm run verify

      - name: Compiler
        run: npm run build

      - name: Construire le paquet MSIX
        run: npx electron-builder --windows --publish never

      - name: Passer le Windows App Certification Kit
        continue-on-error: true
        shell: pwsh
        run: |
          $appcert = "${env:ProgramFiles(x86)}\Windows Kits\10\App Certification Kit\appcert.exe"
          if (-not (Test-Path $appcert)) {
            Write-Host "::warning::appcert.exe introuvable, contrôle ignoré"
            exit 0
          }
          $package = Get-ChildItem release\*.appx | Select-Object -First 1
          if ($null -eq $package) {
            Write-Host "::warning::aucun .appx produit, contrôle ignoré"
            exit 0
          }
          $report = Join-Path (Resolve-Path release) 'wack-report.xml'
          & $appcert reset
          & $appcert test -appxpackagepath $package.FullName -reportoutputpath $report
          exit 0

      - name: Publier l’artefact de l’exécution
        uses: actions/upload-artifact@v4
        with:
          name: chronocast-msix
          path: |
            release/*.appx
            release/wack-report.xml
          retention-days: 30
          if-no-files-found: error
