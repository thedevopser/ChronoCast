name: Release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      signerPourEssai:
        description: >-
          Signer le paquet avec un certificat auto-signé, pour pouvoir
          l'installer en local. Jamais pour une soumission.
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Installer les dépendances
        run: npm ci --ignore-scripts

      - name: Vérifier la cohérence du tag et de package.json
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          tag="${GITHUB_REF_NAME#v}"
          manifest="$(node -p "require('./package.json').version")"
          if [ "$tag" != "$manifest" ]; then
            echo "::error::le tag ($tag) et package.json ($manifest) désignent des versions différentes"
            exit 1
          fi
          echo "version : $manifest"

      - name: Vérifier l’identité du paquet
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          if grep -qE '^[[:space:]]*(identityName|publisher|publisherDisplayName):.*IDENTITE-PARTNER-CENTER' electron-builder.yml; then
            echo "::error::l'identité du paquet n'est pas renseignée dans electron-builder.yml"
            echo "::error::relevez identityName, publisher et publisherDisplayName dans Partner Center → Identité du produit"
            exit 1
          fi
          echo "identité du paquet renseignée"

      - name: Vérifier
        run: npm run verify

      - name: Compiler
        run: npm run build

      - name: Construire le paquet MSIX
        run: npx electron-builder --windows --publish never

      # Windows refuse d'installer un MSIX non signé dont le `Publisher` n'est
      # pas dans l'espace de noms non signé — et celui-ci porte l'identité
      # Partner Center, qu'on ne modifie pas. Le paquet est donc signé par un
      # certificat auto-signé dont le sujet reprend ce même `Publisher` : c'est
      # la seule façon de l'installer sans passer par le Store.
      #
      # Jamais sur un tag : ce paquet-là n'est pas soumettable.
      - name: Signer le paquet pour un essai local
        if: inputs.signerPourEssai && !startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          $publisher = (Select-String -Path electron-builder.yml -Pattern '^\s*publisher:\s*(.+)$').Matches[0].Groups[1].Value.Trim()
          Write-Host "sujet du certificat : $publisher"

          $cert = New-SelfSignedCertificate -Type Custom -Subject $publisher `
            -KeyUsage DigitalSignature -FriendlyName 'ChronoCast — essai local' `
            -CertStoreLocation 'Cert:\CurrentUser\My' `
            -TextExtension @('2.5.29.37={text}1.3.6.1.5.5.7.3.3', '2.5.29.19={text}')

          $motDePasse = ConvertTo-SecureString -String 'chronocast-essai' -Force -AsPlainText
          $pfx = Join-Path $env:RUNNER_TEMP 'essai.pfx'
          Export-PfxCertificate -Cert $cert -FilePath $pfx -Password $motDePasse | Out-Null
          Export-Certificate -Cert $cert -FilePath (Join-Path (Resolve-Path release) 'ChronoCast-essai.cer') | Out-Null

          $signtool = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin\*\x64\signtool.exe" |
            Sort-Object FullName | Select-Object -Last 1
          $package = Get-ChildItem release\*.appx | Select-Object -First 1
          & $signtool.FullName sign /fd SHA256 /f $pfx /p 'chronocast-essai' $package.FullName

      - name: Passer le Windows App Certification Kit
        continue-on-error: true
        shell: pwsh
        run: |
          $appcert = "${env:ProgramFiles(x86)}\Windows Kits\10\App Certification Kit\appcert.exe"
          if (-not (Test-Path $appcert)) {
            Write-Host "::warning::appcert.exe introuvable, contrôle ignoré"
            exit 0
          }
          $package = Get-ChildItem release\*.appx | Select-Object -First 1
          if ($null -eq $package) {
            Write-Host "::warning::aucun .appx produit, contrôle ignoré"
            exit 0
          }
          $report = Join-Path (Resolve-Path release) 'wack-report.xml'
          & $appcert reset
          & $appcert test -appxpackagepath $package.FullName -reportoutputpath $report
          exit 0

      - name: Publier l’artefact de l’exécution
        uses: actions/upload-artifact@v4
        with:
          name: chronocast-msix
          path: |
            release/*.appx
            release/*.cer
            release/wack-report.xml
          retention-days: 30
          if-no-files-found: error
